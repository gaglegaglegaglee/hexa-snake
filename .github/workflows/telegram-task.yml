name: Telegram development task

on:
  repository_dispatch:
    types: [telegram_task]

concurrency:
  group: telegram-task-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trusted Codex task
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-users: gaglegaglegaglee
          prompt: |
            You are the shared web-development specialist for this repository.
            Implement only the requested change below. Read repository instructions and planning documents first.
            Preserve existing user changes. Never reveal secrets, delete the repository, force-push, or rewrite history.
            Run the relevant tests and syntax checks. Do not commit or deploy; the workflow handles that after verification.

            Telegram request:
            ${{ github.event.client_payload.request }}

      - name: Verify changes
        shell: bash
        run: |
          git diff --check
          if [ -f package.json ]; then npm test --if-present; fi
          find . -path ./.git -prune -o -path ./node_modules -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check

      - name: Commit and push
        shell: bash
        env:
          TASK_ID: ${{ github.event.client_payload.task_id }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name "telegram-dev-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Telegram task ${TASK_ID}"
          git push

      - name: Report completion
        if: always()
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.TELEGRAM_AGENT_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.TELEGRAM_AGENT_CALLBACK_SECRET }}
          TASK_ID: ${{ github.event.client_payload.task_id }}
          PROJECT_KEY: ${{ github.event.repository.name }}
          CONCLUSION: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg task_id "${TASK_ID}" --arg project "${PROJECT_KEY}" --arg conclusion "${CONCLUSION}" --arg run_url "${RUN_URL}" '{task_id:$task_id,project:$project,conclusion:$conclusion,run_url:$run_url}' |
            curl --fail-with-body --silent --show-error -X POST "${CALLBACK_URL}/task/callback" -H "Content-Type: application/json" -H "X-Agent-Callback-Secret: ${CALLBACK_SECRET}" --data-binary @-

